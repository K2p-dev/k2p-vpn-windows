name: Build and Release Windows Client

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file x64
        run: |
          dotnet publish K2pVpnWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          $ver = $tag.TrimStart('v', 'V')
          New-Item -ItemType Directory -Force -Path "release_assets" | Out-Null
          iscc /DMyAppVersion="$ver" installer.iss
          Copy-Item "release_assets\K2pVpn-Setup-v${ver}.exe" "release_assets\K2pVpn-Setup.exe" -Force
          Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Upload Actions Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: K2pVpn-Setup-${{ env.RELEASE_TAG }}
          path: release_assets/*.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          gh release delete "$TAG" --yes || true
          (gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.draft == true) | .id' | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}") || true

          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" --title "Как 2 пальца (K2P VPN) $TAG" --notes "Установщик Windows для релиза $TAG"; then
              break
            fi
            echo "gh release create failed (attempt $attempt), retrying in 15s..."
            sleep 15
            [ "$attempt" -eq 5 ] && exit 1
          done

          for f in release_assets/*.exe; do
            echo "Uploading $f..."
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "Uploaded $f successfully"
                break
              fi
              echo "Attempt $attempt failed for $f, retrying in 15s..."
              sleep 15
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
            done
          done
